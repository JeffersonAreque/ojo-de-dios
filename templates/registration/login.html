{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block publico %}
<div class="login">
  <div class="text-center mb-4">
    <div class="fs-2 fw-bold" style="color:var(--bosque)"><i class="bi bi-eye"></i> Ojo de Dios</div>
    <div class="text-secondary">Vigilancia forestal con dron e IA · Zona de amortiguamiento RN Tambopata</div>
  </div>
  <div class="tarjeta">
    {% if form.errors %}<div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <label class="form-label">Usuario</label>
      <input name="username" class="form-control mb-3" autofocus required>
      <label class="form-label">Contraseña</label>
      <input name="password" type="password" class="form-control mb-4" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-bosque w-100">Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
